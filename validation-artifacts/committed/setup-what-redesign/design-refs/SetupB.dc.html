<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Setup B: title block</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
.cell{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:64px;box-sizing:border-box;padding:10px 12px;background:none;border:0;border-right:1px solid #2c3e53;border-bottom:1px solid #2c3e53;color:#eaf0f7;font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:15px;text-align:left;cursor:pointer}
.cell:hover{background:#1a2a3b}
.k{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:10px;letter-spacing:0.12em;color:#93a0b0}
.unset{color:#93a0b0}
</style>
</helmet>
<div style="width: 880px; height: 260px; box-sizing: border-box; padding: 24px; background: #14202e; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #eaf0f7;">
<section style="border: 1px solid #2c3e53; background: #16232f;">
<header style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid #2c3e53;">
<span style="width: 16px; color: #4fd787; font-size: 13.5px;">✓</span>
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.18em; font-weight: 500;">SETUP</span>
<span style="flex-grow: 1;"></span>
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10.5px; letter-spacing: 0.04em; color: #93a0b0;">pick a cell to change it</span>
</header>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); margin-right: -1px; margin-bottom: -1px;">
<button class="cell" style="grid-column: span 2;"><span class="k">ROAD</span><span>East Colfax Avenue Westbound</span></button>
<button class="cell"><span class="k">WORK</span><span>Shoulder work</span></button>
<button class="cell"><span class="k">LENGTH</span><span>1,000 ft</span></button>
<button class="cell"><span class="k">SPEED</span><span>30 mph</span></button>
<button class="cell"><span class="k">LANES</span><span>2 × 12 ft</span></button>
<button class="cell"><span class="k">ROAD TYPE</span><span>Urban arterial</span></button>
<button class="cell"><span class="k">JURISDICTION</span><span class="unset">◌ not set</span></button>
<button class="cell" style="grid-column: span 2;"><span class="k">DATES</span><span class="unset">◌ not set</span></button>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":880,"height":260}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
