name: Python tests

on:
  # Every branch, not only main (R50): the ship checks CI on the tip it
  # merges, so the tip needs runs of its own before the go.
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        # Exact tag by necessity, not style: setup-uv stopped
        # publishing major tags at v8 — `@v9` does not exist (#170).
        uses: astral-sh/setup-uv@v9.0.0

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Pytest (full suite)
        # -rs: every skip prints its reason (R50: Windows-only tests say so).
        run: uv run pytest -rs
