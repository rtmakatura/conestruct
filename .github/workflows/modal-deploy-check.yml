name: Modal deploy check

# Detect when a push to main touches the Python render service and
# remind the operator to run `modal deploy modal_app.py` — Vercel
# auto-deploys the Next.js site on every push, but Modal does not.
# At most ONE open `modal-deploy-needed` issue at a time: subsequent
# undeployed pushes append a comment to it and bump the title to the
# latest SHA. Close the issue once you've run the deploy.

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

concurrency:
  group: modal-deploy-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Python diff
        id: diff
        shell: bash
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          # First push to a fresh branch can have a zero-SHA "before".
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$(git rev-parse "$AFTER^" 2>/dev/null || echo "$AFTER")"
          fi

          CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" -- \
            'src/**/*.py' 'modal_app.py' 'pyproject.toml' 'uv.lock' || true)

          if [ -z "$CHANGED" ]; then
            echo "needs_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_deploy=true" >> "$GITHUB_OUTPUT"
            {
              echo "files<<EOF"
              echo "$CHANGED"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Update or open Modal-deploy reminder issue
        if: steps.diff.outputs.needs_deploy == 'true'
        uses: actions/github-script@v7
        env:
          CHANGED_FILES: ${{ steps.diff.outputs.files }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        with:
          script: |
            const sha = process.env.COMMIT_SHA;
            const shortSha = sha.slice(0, 7);
            const fileList = process.env.CHANGED_FILES
              .split('\n').filter(Boolean).map(f => `- \`${f}\``).join('\n');
            const commitMessage = (process.env.COMMIT_MESSAGE || '')
              .split('\n').join('\n> ');

            const title = `Modal deploy needed for ${shortSha}`;

            // Find an existing open reminder. If multiple exist (e.g. a
            // pre-existing stale backlog), take the newest and treat it
            // as canonical — older ones get closed manually.
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'modal-deploy-needed',
              sort: 'created',
              direction: 'desc',
              per_page: 100,
            });
            // listForRepo returns PRs as issues — filter them out.
            const existing = openIssues.find(i => !i.pull_request);

            if (existing) {
              const commentBody = [
                `Commit [${shortSha}](${process.env.COMMIT_URL}) added more`,
                `undeployed Python changes.`,
                ``,
                `**Changed files:**`,
                fileList,
                ``,
                `**Commit message:**`,
                '> ' + commitMessage,
              ].join('\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: commentBody,
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
              });
            } else {
              const body = [
                `Commit [${shortSha}](${process.env.COMMIT_URL}) touched the Python`,
                `render service.  The Next.js site auto-deploys via Vercel, but the`,
                `Modal-hosted render API does **not** — run the deploy locally:`,
                ``,
                '```bash',
                'modal deploy modal_app.py',
                '```',
                ``,
                `**Changed files:**`,
                fileList,
                ``,
                `**Commit message:**`,
                '> ' + commitMessage,
                ``,
                `Close this issue once Modal has been redeployed and conestruct.com`,
                `is serving the new render code. Until then, subsequent undeployed`,
                `pushes will append comments here and bump the title to the latest SHA.`,
              ].join('\n');

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['modal-deploy-needed'],
              });
            }
