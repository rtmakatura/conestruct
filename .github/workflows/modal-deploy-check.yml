name: Modal deploy check

# Self-resolving backend-drift detector.
#
# Vercel auto-deploys the Next.js site on every push, but Modal does
# NOT — `modal deploy modal_app.py` is a manual step, so production can
# drift behind the backend code on `main`.  #94 stamps the deployed
# commit into `/healthz` (`{status, sha}`; `"unknown"` if unstamped),
# so the live backend version is readable over HTTP.
#
# This workflow polls `/healthz`, compares the SERVED commit against
# `main` HEAD over the backend file scope (`src/**/*.py`, `modal_app.py`,
# `pyproject.toml`, `uv.lock`), and keeps exactly ONE open
# `modal-deploy-needed` issue alive ONLY while a backend deploy is owed:
# it opens itself when the live backend falls behind backend code, and
# closes itself once a deploy makes it current.  No per-push noise, no
# hand-closing.
#
# Note we compare by backend-file scope, not raw SHA equality: a
# frontend/docs/workflow-only commit advances `main` HEAD but requires
# no backend deploy, so raw equality would false-fire permanently.

on:
  schedule:
    # Public repo — 15-minute cadence (a reminder doesn't need tighter).
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      healthz_url_override:
        description: >-
          Base URL to probe instead of the MODAL_RENDER_URL repo variable.
          Test hook: point it at an unreachable host (e.g. https://127.0.0.1:1)
          or a non-200 endpoint to prove the run fails loudly. Leave blank for
          the real backend.
        required: false
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: modal-deploy-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Full history so the served commit is reachable for the diff.
          fetch-depth: 0

      - name: Read served SHA from /healthz
        id: served
        shell: bash
        env:
          MODAL_URL: ${{ vars.MODAL_RENDER_URL }}
          URL_OVERRIDE: ${{ github.event.inputs.healthz_url_override }}
        run: |
          # A manual run may override the target (test hook, #134); otherwise
          # use the repo variable.
          if [ -n "$URL_OVERRIDE" ]; then
            MODAL_URL="$URL_OVERRIDE"
            echo "Using workflow_dispatch override URL: $MODAL_URL"
          fi
          if [ -z "$MODAL_URL" ]; then
            echo "::error::Repo variable MODAL_RENDER_URL is not set — run: gh variable set MODAL_RENDER_URL --body '<modal-base-url>'"
            exit 1
          fi

          # The probe itself (retry loop, http-code capture, exit-code
          # taxonomy from #168: unreachable -> red, non-200 -> red with
          # a distinct message, 200 -> served sha to GITHUB_OUTPUT)
          # lives in scripts/modal-healthz-probe.mjs so vitest covers
          # it (#169) instead of a manual dispatch being the only proof.
          node scripts/modal-healthz-probe.mjs "$MODAL_URL"

      - name: Determine whether a backend deploy is owed
        id: owed
        if: steps.served.outputs.reachable == 'true'
        shell: bash
        run: |
          SERVED="${{ steps.served.outputs.served_sha }}"
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

          # Unstamped image can't prove it's current → deploy owed.
          if [ "$SERVED" = "unknown" ]; then
            echo "Served image is unstamped (sha=unknown) — treating as deploy owed."
            echo "owed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Served SHA must resolve in the fetched history.  If it doesn't
          # (force-push, orphaned commit), we can't prove the live backend
          # is current → deploy owed.
          if ! git cat-file -e "${SERVED}^{commit}" 2>/dev/null; then
            echo "Served SHA $SERVED not found in history — treating as deploy owed."
            echo "owed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Deploy owed iff a backend-affecting file changed between the
          # served commit and HEAD.  Same scope the old push-trigger used,
          # but anchored to the deployed commit instead of before..after.
          CHANGED="$(git diff --name-only "$SERVED" "$HEAD_SHA" -- \
            'src/**/*.py' 'modal_app.py' 'pyproject.toml' 'uv.lock' || true)"

          if [ -z "$CHANGED" ]; then
            echo "No backend-affecting changes between served ($SERVED) and HEAD ($HEAD_SHA) — backend is current."
            echo "owed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Backend-affecting changes since the served commit:"
            echo "$CHANGED"
            echo "owed=true" >> "$GITHUB_OUTPUT"
            {
              echo "changed<<EOF"
              echo "$CHANGED"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Reconcile modal-deploy-needed issue
        if: steps.served.outputs.reachable == 'true'
        uses: actions/github-script@v9.0.0
        env:
          OWED: ${{ steps.owed.outputs.owed }}
          SERVED_SHA: ${{ steps.served.outputs.served_sha }}
          HEAD_SHA: ${{ steps.owed.outputs.head_sha }}
          CHANGED_FILES: ${{ steps.owed.outputs.changed }}
        with:
          script: |
            const LABEL = 'modal-deploy-needed';
            const owed = process.env.OWED === 'true';
            const served = process.env.SERVED_SHA;
            const head = process.env.HEAD_SHA;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: LABEL,
              per_page: 100,
            });
            // listForRepo returns PRs as issues — filter them out.
            const open = issues.filter(i => !i.pull_request);

            if (owed) {
              if (open.length > 0) {
                console.log(`Deploy owed; ${open.length} reminder issue(s) already open — leaving untouched.`);
                return;
              }
              const fileList = (process.env.CHANGED_FILES || '')
                .split('\n').filter(Boolean).map(f => `- \`${f}\``).join('\n');
              const body = [
                'The live backend (Modal) is behind the latest backend code on `main`.',
                '',
                `- **Served (\`/healthz\`):** \`${served}\``,
                `- **Latest \`main\` HEAD:** \`${head}\``,
                '',
                '**Backend-affecting files changed since the served commit:**',
                fileList || '_(served image is unstamped — `sha=unknown`)_',
                '',
                'Run the deploy locally to bring production current:',
                '',
                '```bash',
                'modal deploy modal_app.py',
                '```',
                '',
                'This issue opened itself and will close itself once `/healthz`',
                'reports a commit whose backend matches `main`. No need to close',
                'it by hand.',
              ].join('\n');

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Backend deploy owed — live site behind latest backend code',
                body,
                labels: [LABEL],
              });
              console.log('Opened a new modal-deploy-needed issue.');
            } else {
              if (open.length === 0) {
                console.log('Backend is current; no open reminders to close.');
                return;
              }
              for (const issue of open) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `Served SHA now matches the latest backend code (\`${served}\`) — deploy confirmed live.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                });
                console.log(`Closed #${issue.number}.`);
              }
            }
