[project]
name = "traffic-control-tool"
version = "0.2.0"
description = "Generate MHT/MOT traffic control plan packages from work zone descriptions — PDF plans, Excel device lists, and crew narratives"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pymupdf>=1.25",
    "pypdfium2>=4.30",
    "pillow>=11.0",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "httpx>=0.28",
    "reportlab>=4.0",
    "svgwrite>=1.4",
    "cairosvg>=2.7",
    "openpyxl>=3.1",
    "jinja2>=3.1",
    "streamlit>=1.40",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "modal>=0.66",
    "sentry-sdk[fastapi]>=2.0",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff==0.15.11",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["validation-artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"legacy/**" = ["E402", "SIM115"]
"scripts/**" = ["E402"]  # bootstrap sys.path before importing src.*

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["src"]
warn_redundant_casts = true
warn_unused_ignores = true

# Strict opt-in for modules that are already strict-clean.
# When a module gets cleaned up, add it here. See TYPES.md.
# Note: `strict = true` in overrides applies the flags globally in mypy 1.x/2.x,
# so we expand the relevant strict-mode flags per-module instead.
[[tool.mypy.overrides]]
module = [
    "src.rules.spacing",
    "src.rules.devices",
    "src.rules.corridor",
    "src.rules.validators",
    "src.rules.tables",
    "src.rules.sign_codes",
    "src.rules.site_adjustments",
    "src.rules.night_adjustments",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
no_implicit_optional = true
warn_return_any = true
warn_unreachable = true
strict_equality = true
extra_checks = true
