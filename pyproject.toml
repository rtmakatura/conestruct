[project]
name = "traffic-control-tool"
version = "0.2.0"
description = "Generate MHT/MOT traffic control plan packages from work zone descriptions — PDF plans, Excel device lists, and crew narratives"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pymupdf>=1.25",
    "pypdfium2>=4.30",
    "pillow>=11.0",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "httpx>=0.28",
    "reportlab>=4.0",
    "svgwrite>=1.4",
    "cairosvg>=2.7",
    "openpyxl>=3.1",
    "jinja2>=3.1",
    "streamlit>=1.40",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "modal>=0.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "pre-commit>=4.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"legacy/**" = ["E402", "SIM115"]
"scripts/**" = ["E402"]  # bootstrap sys.path before importing src.*

[tool.pytest.ini_options]
testpaths = ["tests"]
